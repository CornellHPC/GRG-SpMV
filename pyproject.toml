[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pygrgl-spmv"
version = "0.1.0"
description = "Sparse matmul kernels for GRG-based genotype matrices"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "AprilWeiLab" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
    "pygrgl>=2.6",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
# Named for the accelerator it targets, not generically: a future ROCm or oneAPI
# backend gets its own extra rather than colliding with a catch-all "gpu".
cuda13 = [
    "cupy-cuda13x>=13.6.0",
    # torch is the CUDA-graph implementation behind capture=True (CUDAGraph, as_strided,
    # the capture stream) -- unrelated to the removed Triton backend. It drags triton in
    # transitively for its own inductor; that is torch's dependency, not ours.
    "torch>=2.10.0",
]
dev = [
    "pytest>=9.0.2",
    # 0.4 for PCs(grgs, k=..., threads=...): 0.3 takes a single GRG and has neither
    # keyword, so the README examples and their test cannot run against it.
    "grapp>=0.4",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "igdtools>=2.6",
    "pandas>=2.3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["pygrgl_spmv"]
exclude = [
    "pygrgl_spmv/tests/**",
    "pygrgl_spmv/**/__pycache__/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/pygrgl_spmv",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    # README links into this; without it the sdist ships a dead link.
    "/docs",
]
exclude = [
    "/pygrgl_spmv/tests/**",
    "/scripts",
    "/dist",
    "/.venv",
]

[tool.pytest.ini_options]
testpaths = [
    "pygrgl_spmv/tests",
]
markers = [
    "stress: long streamed GPU stress tests",
    "cuda13: tests requiring a CUDA 13 GPU (CuPy + cuSPARSE)",
    "mkl: tests specific to MKL backend",
    "cusparse: tests specific to cuSPARSE backend",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
pythonPlatform = "x86_64-unknown-linux-gnu"
